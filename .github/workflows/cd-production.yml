# Deploys a tag such as v1.2.3. Images are built here, never on the server.
# Setup is described in docs/deployment.md, under "Automated deploys".

name: CD Production

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/medusa-backend:${{ github.ref_name }}
  STOREFRONT_IMAGE: ghcr.io/${{ github.repository_owner }}/medusa-storefront:${{ github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push storefront
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/storefront/Dockerfile
          push: true
          tags: ${{ env.STOREFRONT_IMAGE }}
          cache-from: type=gha,scope=storefront
          cache-to: type=gha,mode=max,scope=storefront
          build-args: |
            NEXT_PUBLIC_MEDUSA_BACKEND_URL=https://api.${{ vars.DOMAIN }}
            NEXT_PUBLIC_BASE_URL=https://${{ vars.DOMAIN }}
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ vars.PUBLISHABLE_KEY }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy
        env:
          TARGET: deploy@${{ vars.VPS_HOST }}
          PORT: ${{ vars.VPS_PORT }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          tar -czf - docker-compose.yml infra/docker infra/scripts \
            | ssh -p "$PORT" "$TARGET" 'tar -xzf - -C /opt/medusa'
          printf '%s' "$TOKEN" \
            | ssh -p "$PORT" "$TARGET" "docker login ghcr.io -u $ACTOR --password-stdin"
          ssh -p "$PORT" "$TARGET" "/opt/medusa/infra/scripts/deploy.sh $BACKEND_IMAGE $STOREFRONT_IMAGE"
          ssh -p "$PORT" "$TARGET" 'docker logout ghcr.io'
